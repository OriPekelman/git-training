baseURL = '/'
defaultContentLanguage = 'en'
theme = 'hugo-book'

# English is served from the root and French from /fr/. The course was written
# in French first, but the 2026 revision was done in English, so English is the
# source of truth and the French is translated from it.
defaultContentLanguageInSubdir = false

# `:information_source:` and `:warning:` are used throughout the content as
# callout markers. Without this they render as literal text.
enableEmoji = true

# The book theme keeps the original casing of section/page paths.
disablePathToLower = true

# Keep every site-wide key above this line. TOML binds a bare key to the table
# that was opened last, so anything written after `[languages]` becomes a
# setting of the last language rather than of the site -- which is exactly how
# `enableEmoji` was once lost, turning every callout marker into literal text.
[languages]
  [languages.en]
    contentDir = 'content/en'
    languageName = 'English'
    languageCode = 'en'
    title = 'Git Getting Started!'
    weight = 1
  [languages.fr]
    contentDir = 'content/fr'
    languageName = 'Français'
    languageCode = 'fr'
    title = 'Git, bien démarrer !'
    weight = 2

# Chapters are served flat from /docs/<slug>/ even though they live in a numbered
# part directory, so the digits that give them their reading order on disk stay
# out of the published address.
#
# This has to be done here rather than with a `url` in front matter: Hugo does
# not add the language prefix to an absolute front-matter `url`, so the French
# pages would silently overwrite the English ones at the same path. Permalink
# patterns are language-aware, so /docs/inside-git/ and /fr/docs/inside-git/
# both build.
#
# Only `page`, deliberately -- never add a `[permalinks.section]` here. It would
# match the top-level `docs` section too, and since that section page has no
# slug of its own Hugo falls back to its title, moving the whole course index
# from /docs/ to /docs/Docs/ while the theme goes on linking to it.
[permalinks]
  [permalinks.page]
    docs = '/docs/:slug/'

[markup]
  [markup.goldmark.renderer]
    # The content uses raw HTML comments (<!-- TODO -->) and a few inline tags.
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'solarized-dark'
    noClasses = false
    lineNos = false
    tabWidth = 2

[params]
  author = 'Ori Pekelman'
  description = 'Getting started with Git: a hands-on course that always looks under the hood.'

  # Book theme
  BookSection = 'docs'

  # Chapters cross-reference each other as `[title](P6C1.md)`, which keeps the
  # links working when the markdown is read on disk or on a forge. This makes
  # Hugo resolve them to real permalinks in the built site instead of emitting a
  # literal `href="P6C1.md"`, and warn at build time about broken ones.
  BookPortableLinks = true
  BookTheme = 'auto'
  BookToC = true
  BookSearch = true
  BookComments = false
  BookSSR = false
  BookSecondaryDark = false
