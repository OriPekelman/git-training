baseURL = '/'
defaultContentLanguage = 'en'
theme = 'hugo-book'

# English is served from the root and French from /fr/. The course was written
# in French first, but the 2026 revision was done in English, so English is the
# source of truth and the French is translated from it.
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = 'content/en'
    languageName = 'English'
    languageCode = 'en'
    title = 'Git Getting Started!'
    weight = 1
  [languages.fr]
    contentDir = 'content/fr'
    languageName = 'Français'
    languageCode = 'fr'
    title = 'Git, bien démarrer !'
    weight = 2

# `:information_source:` and `:warning:` are used throughout the content as
# callout markers. Without this they render as literal text.
enableEmoji = true

# The book theme keeps the original casing of section/page paths.
disablePathToLower = true

# The part directories carry a leading number so they sort in reading order on
# disk and in the sidebar. This keeps that number out of the published address.
# It has to be done here rather than with a `url` in front matter: Hugo does not
# add the language prefix to an absolute front-matter `url`, so the French pages
# would silently overwrite the English ones at the same path. Permalink patterns
# are language-aware, so /docs/inside-git/ and /fr/docs/inside-git/ both work.
[permalinks]
  [permalinks.page]
    docs = '/docs/:slug/'
  [permalinks.section]
    docs = '/docs/:slug/'

[markup]
  [markup.goldmark.renderer]
    # The content uses raw HTML comments (<!-- TODO -->) and a few inline tags.
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = 'solarized-dark'
    noClasses = false
    lineNos = false
    tabWidth = 2

[params]
  author = 'Ori Pekelman'
  description = 'Getting started with Git: a hands-on course that always looks under the hood.'

  # Book theme
  BookSection = 'docs'

  # Chapters cross-reference each other as `[title](P6C1.md)`, which keeps the
  # links working when the markdown is read on disk or on a forge. This makes
  # Hugo resolve them to real permalinks in the built site instead of emitting a
  # literal `href="P6C1.md"`, and warn at build time about broken ones.
  BookPortableLinks = true
  BookTheme = 'auto'
  BookToC = true
  BookSearch = true
  BookComments = false
  BookSSR = false
  BookSecondaryDark = false
